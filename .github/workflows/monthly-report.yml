name: Rapporto mensile

# Il 1° di ogni mese (circa alle 7-8 ora italiana) chiede al server il rapporto del mese appena finito.
# Il server lo calcola, lo salva e lo manda per email a infoapp@scambiofavori.it.
# Serve il segreto MONTHLY_REPORT_TOKEN, uguale a quello messo su Render.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Chiede il rapporto al server
        env:
          MONTHLY_REPORT_TOKEN: ${{ secrets.MONTHLY_REPORT_TOKEN }}
        run: |
          if [ -z "$MONTHLY_REPORT_TOKEN" ]; then
            echo "Segreto MONTHLY_REPORT_TOKEN mancante: rapporto non richiesto."
            exit 1
          fi
          # Il server gratuito si addormenta e ci mette circa un minuto a svegliarsi: fino a 4 tentativi
          for attempt in 1 2 3 4; do
            code=$(curl --silent --show-error --max-time 150 --output response.json --write-out "%{http_code}" \
              -X POST -H "X-Report-Token: $MONTHLY_REPORT_TOKEN" -H "Content-Type: application/json" -d '{}' \
              https://scambio-di-favori-api.onrender.com/api/admin/monthly-report || echo 000)
            echo "Tentativo $attempt: risposta $code"
            if [ "$code" = "200" ]; then
              python3 -c "import json; d=json.load(open('response.json')); print('Rapporto', d['period'], '- email inviata:', d['email_sent'])"
              exit 0
            fi
            sleep 30
          done
          echo "Il rapporto non è stato richiesto."
          exit 1
